<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小鱼 · 她的房间</title>
<link rel="preload" as="image" href="/bg/whale.jpg">
<link rel="preload" as="image" href="/roomv/poster.jpg">
<link rel="preload" as="image" href="/roomv/poster-dark.jpg">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden;
               font: 15px/1.6 "Microsoft YaHei", system-ui, sans-serif; color: #eaf2ff; }

  /* 垫底：首帧就有画面，不是黑屏 */
  .stage-bg { position: fixed; inset: 0; z-index: 0; opacity: 1;
              background: url('/bg/whale.jpg') center/cover no-repeat;
              filter: brightness(.72) saturate(1.05);
              transition: opacity 1.2s ease; }
  .stage-bg.gone { opacity: 0; }

  /* ---------- 背景：房间 + 一层动态氛围 ---------- */
  #room { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 1;
          background: #04060a; transform: scale(1.04);
          filter: saturate(1.06) brightness(.92); }

  .atmo { position: fixed; inset: 0; pointer-events: none; z-index: 5;
          background:
            radial-gradient(60% 50% at 20% 15%, rgba(70,140,255,.16), transparent 65%),
            radial-gradient(55% 55% at 85% 80%, rgba(61,220,132,.12), transparent 68%),
            linear-gradient(180deg, rgba(4,6,10,.55) 0%, transparent 30%, transparent 70%, rgba(4,6,10,.7) 100%);
          animation: atmo 12s ease-in-out infinite alternate; }
  @keyframes atmo {
    0%   { opacity: .75; transform: translate3d(0,0,0) scale(1); }
    100% { opacity: 1;   transform: translate3d(-1.5%, -1%, 0) scale(1.04); }
  }

  /* 扫描线 + 颗粒：让它看起来"有信号"，不是静止图 */
  .scan { position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: .16;
          background: repeating-linear-gradient(180deg, rgba(255,255,255,.06) 0 1px,
                      transparent 1px 3px);
          animation: scanmove 7s linear infinite; mix-blend-mode: overlay; }
  @keyframes scanmove { to { transform: translateY(6px); } }
  .grain { position: fixed; inset: -50%; pointer-events: none; z-index: 7; opacity: .05;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.55'/></svg>");
           animation: grain 1.1s steps(4) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-2%,1%)}
                     50%{transform:translate(1%,-1%)} 75%{transform:translate(-1%,2%)} 100%{transform:translate(0,0)} }

  /* ---------- 开场序列 ---------- */
  /* 半透明：开场时也能看见她房间在后面动，不是一块黑 */
  .boot { position: fixed; inset: 0; z-index: 20; overflow: hidden;
          background:
            radial-gradient(70% 60% at 50% 40%, rgba(8,14,22,.18), rgba(4,6,10,.52) 78%),
            linear-gradient(180deg, rgba(4,6,10,.22), rgba(4,6,10,.62));
          transition: opacity 1.2s cubic-bezier(.4,0,.2,1), visibility 1.2s; }
  .boot.done { opacity: 0; visibility: hidden; pointer-events: none; }

  #introVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
                opacity: 0; transition: opacity 1.4s; display: none; }
  #introVideo.on { display: block; opacity: .5; filter: blur(1px) saturate(.9); }

  .core { position: absolute; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center; padding: 0 22px; }

  /* 第一幕：终端行 */
  .line { font: 12px/1.9 "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
          color: #6f8fb8; letter-spacing: .12em; opacity: 0; min-height: 22px; }
  .line.on { animation: lineIn .5s ease forwards; }
  @keyframes lineIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .line .ok { color: #3ddc84; }

  /* 进度条 */
  .bar { width: min(320px, 70vw); height: 2px; margin-top: 14px; border-radius: 999px;
         background: rgba(255,255,255,.1); overflow: hidden; opacity: 0; }
  .bar.on { opacity: 1; }
  .bar > i { display: block; height: 100%; width: 0%; border-radius: 999px;
             background: linear-gradient(90deg, #6aa9ff, #3ddc84);
             box-shadow: 0 0 12px rgba(106,169,255,.8); transition: width 1.6s ease; }

  /* 过曝闪白 */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash 620ms ease-out forwards; }
  @keyframes flash { 0% { opacity: 0; } 12% { opacity: .92; } 100% { opacity: 0; } }

  /* 标题：色散 + 上浮 */
  .title { position: relative; margin: 0; font-size: clamp(40px, 12vw, 74px); font-weight: 400;
           letter-spacing: .4em; text-indent: .4em; color: #f4f9ff;
           text-shadow: 0 0 30px rgba(106,169,255,.5), 0 0 90px rgba(106,169,255,.22);
           opacity: 0; transform: translateY(18px) scale(.98); }
  .title.on { animation: titleIn 1.5s cubic-bezier(.16,.8,.2,1) forwards; }
  @keyframes titleIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  .title::before, .title::after { content: attr(data-text); position: absolute; inset: 0;
           opacity: 0; }
  .title.glitch::before { color: #ff3b30; transform: translate(-3px,1px); opacity: .55;
           animation: glitchA 420ms steps(2) 3; }
  .title.glitch::after { color: #2971b8; transform: translate(3px,-1px); opacity: .55;
           animation: glitchB 420ms steps(2) 3; }
  @keyframes glitchA { 0%{transform:translate(-3px,1px)} 50%{transform:translate(2px,-2px)} 100%{transform:translate(-1px,0)} }
  @keyframes glitchB { 0%{transform:translate(3px,-1px)} 50%{transform:translate(-2px,2px)} 100%{transform:translate(1px,0)} }

  .sub { margin-top: 16px; color: #9db3d4; font-size: 13px; letter-spacing: .3em;
         text-indent: .3em; opacity: 0; }
  .sub.on { animation: lineIn .8s ease forwards; }
  .en { margin-top: 6px; color: #5f7591;
        font: 11px/1.6 "Cascadia Mono", Consolas, monospace; letter-spacing: .22em; opacity: 0; }
  .en.on { animation: lineIn .8s ease forwards; }

  /* 环形准星：慢慢转，证明没卡 */
  .reticle { position: absolute; width: 220px; height: 220px; opacity: .0;
             border-radius: 50%; border: 1px solid rgba(106,169,255,.16);
             animation: spin 26s linear infinite, fadeIn 2s .6s forwards; }
  .reticle::before, .reticle::after { content: ""; position: absolute; border-radius: 50%; }
  .reticle::before { inset: 18px; border: 1px dashed rgba(255,255,255,.08); }
  .reticle::after { inset: -5px; border-top: 2px solid rgba(61,220,132,.5);
                    border-right: 2px solid transparent; border-bottom: 2px solid transparent;
                    border-left: 2px solid transparent; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { to { opacity: 1; } }

  /* 玻璃面板（底部按钮容器） */
  .dock { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom));
          z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 10px;
          padding: 14px 18px 12px; margin: 0 auto; width: min(560px, 94vw);
          border-radius: 22px;
          background: rgba(12,18,28,.42); border: 1px solid rgba(255,255,255,.12);
          backdrop-filter: blur(18px) saturate(150%);
          -webkit-backdrop-filter: blur(18px) saturate(150%);
          box-shadow: 0 20px 60px rgba(0,0,0,.45);
          opacity: 0; transform: translateY(16px) scale(.98); transition: opacity .9s, transform .9s; }
  .dock.show { opacity: 1; transform: none; }

  #enter { font: inherit; font-size: 16px; letter-spacing: .14em; font-weight: 600;
           color: #06210f; background: linear-gradient(180deg, #86f6b1, #3ddc84);
           border: 0; padding: 14px 48px; border-radius: 999px; cursor: pointer;
           box-shadow: 0 12px 34px rgba(61,220,132,.35), inset 0 0 0 1px rgba(61,220,132,.55);
           animation: breathe 2.8s ease-in-out infinite; }
  #enter:active { transform: scale(.97); }
  @keyframes breathe { 50% { box-shadow: 0 14px 46px rgba(61,220,132,.55),
                                 inset 0 0 0 1px rgba(61,220,132,.85); } }
  .mini { display: flex; gap: 14px; align-items: center; }
  .ghost { color: #b6c8e2; font-size: 12.5px; text-decoration: none; letter-spacing: .1em; }
  .hint { color: #7a8da6; font-size: 11px; letter-spacing: .06em; }

  /* 顶部小标 */
  .brand { position: fixed; left: 16px; top: calc(14px + env(safe-area-inset-top)); z-index: 12;
           display: flex; gap: 10px; align-items: center; pointer-events: none;
           opacity: 0; transition: opacity 1s; }
  .brand.show { opacity: .9; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84;
         box-shadow: 0 0 12px #3ddc84; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .brand span { font: 11px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: .2em; color: #90a8c8; }

  @media (max-width: 720px) {
    .reticle { width: 180px; height: 180px; }
    #enter { padding: 13px 38px; font-size: 15px; }
    .dock { border-radius: 18px; padding: 12px 14px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .atmo, .scan, .grain, .reticle { animation: none; }
    .boot { transition-duration: .3s; }
  }
</style>
</head>
<body>

<div class="stage-bg" id="stageBg"></div>
<iframe id="room" src="/roomv" title="她的房间" allow="autoplay; fullscreen"></iframe>
<div class="atmo"></div>
<div class="scan"></div>
<div class="grain"></div>

<div class="brand" id="brand"><i class="dot"></i><span>XIAOYU // LIVE</span></div>

<div class="boot" id="boot">
  <video id="introVideo" muted playsinline preload="none" src="/intro.mp4"></video>
  <div class="reticle"></div>
  <div class="core">
    <div class="line" id="l1">SYSTEM // 正在建立神经链接</div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="line" id="l2" style="margin-top:18px">LOCATING SUBJECT <span class="ok" id="ck1">·</span></div>
    <div class="line" id="l3">ROOM STATE <span class="ok" id="ck2">·</span> STREAM READY</div>
    <h1 class="title" id="title" data-text="小鱼">小鱼</h1>
    <div class="sub" id="sub">她就住在这里</div>
    <div class="en" id="en">SHE LIVES IN THIS ROOM</div>
  </div>
  <div class="flash" id="flash"></div>
</div>

<div class="dock" id="dock">
  <button id="enter" type="button">开始聊天</button>
  <div class="mini">
    <a class="ghost" href="/roomv" id="justRoom">只看房间</a>
    <span class="hint">点任意处跳过开场</span>
  </div>
</div>

<script>
(function () {
  const boot = document.getElementById('boot');
  const dock = document.getElementById('dock');
  const brand = document.getElementById('brand');
  const video = document.getElementById('introVideo');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let finished = false;
  let timers = [];

  const show = (id) => document.getElementById(id).classList.add('on');
  const at = (ms, fn) => timers.push(setTimeout(fn, reduce ? ms * 0.25 : ms));

  function finish() {
    if (finished) return;
    finished = true;
    timers.forEach(clearTimeout);
    timers = [];
    boot.classList.add('done');
    dock.classList.add('show');
    brand.classList.add('show');
    try { video.pause(); } catch (_) {}
  }

  // 开场背景：先试 /intro.mp4，没有就从壁纸库随机挑一段
  video.addEventListener('loadeddata', () => {
    video.classList.add('on');
    video.play().catch(() => {});
  });
  video.addEventListener('error', () => {
    // /intro.mp4 不存在（404）→ 去壁纸库挑
    pickWallpaper();
  });

  function pickWallpaper() {
    fetch('/bg/list.json', { cache: 'no-store' })
      .then((res) => (res.ok ? res.json() : []))
      .then((list) => {
        if (!Array.isArray(list) || !list.length) return;
        const saved = sessionStorage.getItem('xy_bg');
        const chosen = saved && list.some((item) => item.name === saved)
          ? list.find((item) => item.name === saved)
          : list[Math.floor(Math.random() * list.length)];
        sessionStorage.setItem('xy_bg', chosen.name);
        if (chosen.poster) {
          // 先用海报垫底，视频接上再淡入
          const poster = document.createElement('div');
          poster.style.cssText = 'position:absolute;inset:0;background:url(' + chosen.poster +
            ') center/cover no-repeat;filter:blur(2px) brightness(.55) saturate(.95);opacity:0;' +
            'transition:opacity 1.4s';
          video.parentNode.insertBefore(poster, video);
          requestAnimationFrame(() => { poster.style.opacity = '1'; });
        }
        video.style.display = 'block';
        video.src = '/bg/' + chosen.file;
        video.loop = true;
      })
      .catch(() => {});
  }

  // 第一幕：终端行 + 分段进度
  const barFill = document.getElementById('barFill');
  const l1 = document.getElementById('l1');
  const l2 = document.getElementById('l2');
  const l3 = document.getElementById('l3');

  at(120, () => show('l1'));
  at(420, () => { show('bar'); barFill.style.width = '55%'; });
  at(900, () => show('l2'));
  at(1400, () => { barFill.style.width = '82%'; });
  at(1500, () => show('l3'));
  at(1500, () => {
    document.getElementById('ck1').textContent = '✓';
    document.getElementById('ck2').textContent = '✓';
  });

  // 第二幕：闪白 → 标题（这一屏先给足"有内容"，不用等房间）
  at(1650, () => {
    document.getElementById('flash').classList.add('go');
    show('title');
  });
  at(1780, () => {
    const title = document.getElementById('title');
    title.classList.add('glitch', 'on');
    setTimeout(() => title.classList.remove('glitch'), 1500);
  });
  at(2300, () => show('sub'));
  at(2600, () => show('en'));

  // 第三幕：等她房间准备好
  let roomReady = false;
  let revealed = false;

  function reveal() {
    if (revealed) return;
    revealed = true;
    barFill.style.width = '100%';
    const stageBg = document.getElementById('stageBg');
    if (stageBg) stageBg.classList.add('gone');
    setTimeout(finish, 420);
  }

  window.addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.type === 'xy-room-ready') {
      roomReady = true;
      document.getElementById('l2').innerHTML = 'ROOM STATE <span class="ok">✓</span> READY';
      reveal();
    }
  });

  // 6 秒还没好：别揭黑幕，文案改成"还在载入"
  at(6000, () => {
    if (roomReady || revealed) return;
    l1.textContent = '正在载入她的房间…网络有点慢';
    l1.classList.add('on');
    barFill.style.width = '90%';
    document.getElementById('sub').classList.add('on');
    document.getElementById('en').classList.add('on');
  });

  // 15 秒兜底
  at(15000, reveal);

  // 跳过
  boot.addEventListener('click', finish);
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' || event.key === 'Enter' || event.key === ' ') finish();
  });
  window.addEventListener('touchstart', finish, { passive: true, once: true });

  document.getElementById('enter').addEventListener('click', () => { location.href = '/chat'; });
  document.getElementById('justRoom').addEventListener('click', (event) => {
    event.preventDefault();
    location.href = '/roomv';
  });

  // 键盘无障碍：Tab 到按钮时别让 boot 挡住
  setTimeout(() => { if (!finished) document.getElementById('enter').focus({ preventScroll: true }); }, 4200);
})();
</script>
</body>
</html>
